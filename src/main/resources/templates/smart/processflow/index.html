<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenUI5 + D3.js Process flow </title>
    <script id="sap-ui-bootstrap" src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_belize"
      data-sap-ui-libs="sap.m"
      data-sap-ui-resourceroots='{"myApp": "./"}'>
    </script>
    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ui.require(["myApp/Component"], function () {
          sap.ui.xmlview({
            viewName: "myApp.view.App"
          }).placeAt("content");
        });
      });
    </script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
